name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 00:00 UTC = 台北時間 08:00 自動執行
  workflow_dispatch:        # 允許在 GitHub 上手動觸發（第一次測試用）

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      models: read     # 允許用內建 GITHUB_TOKEN 呼叫 GitHub Models 免費 AI
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # 用 GitHub 內建 token 當 AI 金鑰（GitHub Models 免費額度），不用自己申請
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          # 同一把 token 也用來提高 GitHub 來源的抓取額度
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 你唯一要自己設定的 Secret：Teams Webhook 網址
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24
