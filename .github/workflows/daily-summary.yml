name: Daily Horizon Summary

on:
  schedule:
    - cron: '25 0 * * *'   # 每天 00:25 UTC = 台北時間 08:25 自動執行（避開整點壅塞）
  workflow_dispatch:        # 允許在 GitHub 上手動觸發

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      models: read     # 允許用內建 GITHUB_TOKEN 呼叫 GitHub Models 免費 AI
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24
